# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  # Ruff - Fast Python linter (replaces flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]

  # Black removed - using ruff-format only for consistency

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Pytest - Run tests before commit (optional but recommended)
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        # `pytest` alone resolves against PATH, which is some other
        # environment's pytest -- one without this project's dependencies, and
        # on a machine whose Homebrew python has moved on, a dangling shebang
        # that fails every push. Run the project's own environment.
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
        args: [--tb=short, -q]
        stages: [pre-push]  # Only run on git push, not on every commit
