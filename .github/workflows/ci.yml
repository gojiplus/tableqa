name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: statqa
      # Set a few points below the current 74% so ordinary churn does not fail
      # CI, but a real regression does. Raise it as coverage climbs.
      coverage-floor: 70
      run-preen: true
      # requires-python is >=3.12, and 3.13 is not in the reusable default.
      # Keep this in step with the Programming Language classifiers.
      python-versions: '["3.12", "3.13", "3.14"]'
