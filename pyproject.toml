[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "statqa"
version = "0.3.0"
description = "Automatically extract structured facts, insights, and Q/A pairs from tabular datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Gaurav Sood"}
]
keywords = [
    "data-analysis",
    "statistics",
    "table-qa",
    "fact-extraction",
    "llm",
    "rag",
    "data-science"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "linkify-it-py>=2.0.3",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
pdf = [
    "pdfplumber>=0.10.0",
]
statistical-formats = [
    "pyreadstat>=1.3.0",
]
examples = [
    "tqdm>=4.65.0",
]
all = [
    "statqa[llm,pdf,statistical-formats,examples]",
]

[project.urls]
Homepage = "https://github.com/gojiplus/statqa"
Documentation = "https://gojiplus.github.io/statqa"
Repository = "https://github.com/gojiplus/statqa"
"Bug Tracker" = "https://github.com/gojiplus/statqa/issues"

[project.scripts]
statqa = "statqa.cli.main:app"

[tool.uv.build-backend]
module-name = "statqa"
module-root = ""

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
# Coverage is opt-in (`pytest --cov`) rather than forced here: generating the
# HTML report on every run left an htmlcov/ tree that spell and link checks
# then walked, and CI asks for the reports it wants explicitly.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests that require LLM API access",
]

# Coverage configuration
[tool.coverage.run]
source = ["statqa"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

# Ruff configuration (replaces flake8, isort, etc.)
[tool.ruff]
line-length = 88
target-version = "py312"
# htmlcov is generated coverage output; data/ holds datasets and survey text,
# not source. preen's checks read this list too, so naming the directories here
# keeps the spell checker out of them as well.
extend-exclude = ["htmlcov", "data"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "B008", "B905", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
# Demonstration scripts: printing to stdout is their output, and they are read
# top-to-bottom rather than imported, so module/function docstrings add noise.
"examples/**" = ["T201", "D"]

[tool.codespell]
# Domain vocabulary rather than typos: .sav/.por are SPSS extensions, and
# `ttest` and `te` (treatment effect) are statistics identifiers.
ignore-words-list = "sav,ttest,te,womens"
# Survey instruments carry respondent-facing text verbatim; it is data, not prose.
# The rest is generated output: minified assets trip the dictionary constantly.
skip = "./examples/anes/data,./examples/anes/templates,./examples/question_templates.txt,./docs/build,./docs/_build,./htmlcov,./.venv,./uv.lock"

[tool.deptry]
pep621_dev_dependency_groups = ["examples", "pdf", "llm", "statistical-formats"]
known_first_party = ["statqa"]
ignore = ["DEP004"]  # Allow optional dependencies

# Pydoclint configuration
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pyright]
include = ["statqa"]
typeCheckingMode = "standard"

[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
# pydoclint is deliberately absent: it requires docstring-parser-fork, which
# installs the same `docstring_parser` module name as the docstring-parser that
# anthropic (the llm extra) requires. Whichever installs second wins, so the two
# cannot share an environment. Run it isolated instead: uvx pydoclint statqa/
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "ipython>=8.12.0",
    "ipdb>=0.13.0",
    "pandas-stubs>=3.0.5.260730",
    "scipy-stubs>=1.18.0.1",
]
