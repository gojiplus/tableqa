[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "statqa"
description = "Automatically extract structured facts, insights, and Q/A pairs from tabular datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Gaurav Sood"}
]
keywords = [
    "data-analysis",
    "statistics",
    "table-qa",
    "fact-extraction",
    "llm",
    "rag",
    "data-science"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    # 0.13 added `legend` to the categorical plots; on 0.12 it is forwarded to
    # matplotlib and raises.
    "seaborn>=0.13.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "linkify-it-py>=2.0.3",
]
version = "0.3.0"

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
pdf = [
    "pdfplumber>=0.10.0",
]
statistical-formats = [
    "pyreadstat>=1.3.0",
]
examples = [
    "tqdm>=4.65.0",
]
all = [
    "statqa[llm,pdf,statistical-formats,examples]",
]

[project.urls]
Homepage = "https://github.com/gojiplus/statqa"
Documentation = "https://gojiplus.github.io/statqa"
Repository = "https://github.com/gojiplus/statqa"
"Bug Tracker" = "https://github.com/gojiplus/statqa/issues"

[project.scripts]
statqa = "statqa.cli.main:app"

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
# Coverage is opt-in (`pytest --cov`) rather than forced here: generating the
# HTML report on every run left an htmlcov/ tree that spell and link checks
# then walked, and CI asks for the reports it wants explicitly.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests that require LLM API access",
]

# Coverage configuration
[tool.coverage.run]
source = ["statqa"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

# Ruff configuration (replaces flake8, isort, etc.)
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["htmlcov", "data"]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
# The four after the fleet defaults are deferred, not accepted: adopting
# py-canon widened `select` and these are what it turned up in statqa/ --
# 37 G004 logging f-strings, 16 PTH123 open() calls, and a handful of
# TC/ICN import placements. Each is a real change to make; none of them is
# a reason to leave CI red while they are made. Drop them one at a time.
ignore = [
    "D203", "D213", "W191", "D206", "D300", "B008", "B905", "E501",
    "G", "PTH", "TC", "ICN",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
# `format` shadows a builtin because Typer derives the CLI flag from the
# parameter name, so renaming it would rename `--format`. ARG001 used to be
# here too, for `pipeline`'s four unused arguments -- it is a stub no longer,
# so the rule is back on and would catch the next one.
"statqa/cli/main.py" = ["A002"]
# Demonstration scripts, read top-to-bottom rather than imported. Lazy
# logging formatting and pathlib idioms are noise in a script whose point
# is to be legible; ARG covers callback signatures the examples must match.
"examples/**" = ["T201", "D", "G", "PTH", "ARG", "RET", "ICN", "TC"]

[tool.codespell]
# Domain vocabulary rather than typos: .sav/.por are SPSS extensions, and
# `ttest` and `te` (treatment effect) are statistics identifiers.
ignore-words-list = "sav,ttest,te,womens"
# Survey instruments carry respondent-facing text verbatim; it is data, not prose.
# The rest is generated output: minified assets trip the dictionary constantly.
skip = "./examples/anes/data,./examples/anes/templates,./examples/question_templates.txt,./docs/build,./docs/_build,./htmlcov,./.venv,./uv.lock"

[tool.deptry]
pep621_dev_dependency_groups = ["examples", "pdf", "llm", "statistical-formats"]
known_first_party = ["statqa"]
ignore = ["DEP004"]  # Allow optional dependencies

# Pydoclint configuration
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pyright]
include = ["statqa"]
typeCheckingMode = "standard"

[tool.uv.build-backend]
module-name = "statqa"
module-root = ""
[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
# pydoclint is deliberately absent: it requires docstring-parser-fork, which
# installs the same `docstring_parser` module name as the docstring-parser that
# anthropic (the llm extra) requires. Whichever installs second wins, so the two
# cannot share an environment. Run it isolated instead: uvx pydoclint statqa/
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    { include-group = "test" },
    "ipython>=8.12.0",
    "ipdb>=0.13.0",
    "pandas-stubs>=3.0.5.260730",
    "scipy-stubs>=1.18.0.1",
    "pre-commit>=4",
]
test = [
    "pytest>=8",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "pyreadstat>=1.3.0",
    "pyyaml>=6.0.3",
]
